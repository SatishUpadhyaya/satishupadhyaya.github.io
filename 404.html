<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404: Page not found &middot; Satish Upadhyaya</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0e13">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon-96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">

<link rel="stylesheet" href="/assets/css/site.css">

<style>
  .err {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 32px 0;
  }
  .err .terminal { max-width: 620px; margin-inline: auto; }
  .err-code {
    font-size: clamp(2.6rem, 12vw, 4.6rem);
    letter-spacing: -3px;
    margin: 2px 0 10px;
    background: linear-gradient(100deg, #ffffff 10%, #a9e9f4 55%, var(--accent) 96%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .err-msg { color: var(--text-dim); font-size: 14px; margin-bottom: 22px; }
  .err-msg .stderr { color: var(--red); }
</style>
</head>

<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

<main class="err">
  <div class="wrap">
    <div class="terminal">
      <div class="terminal-bar">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <span class="terminal-title">satish@localhost: /dev/null &mdash; zsh</span>
      </div>

      <div class="terminal-body">
        <p class="cmd"><span class="prompt">$</span> cat <span id="req-path">requested-page</span></p>

        <h1 class="err-code">404</h1>

        <p class="err-msg">
          <span class="stderr">cat:</span> No such file or directory.<br>
          I've misplaced that URL, or it's pointing at something that doesn't exist.
        </p>

        <p class="cmd"><span class="prompt">$</span> cd ~<span class="cursor" aria-hidden="true"></span></p>
      </div>
    </div>

    <div class="hero-actions" style="justify-content:center">
      <a class="btn btn-primary" href="/">Head back home</a>
      <a class="btn" href="/#projects">View projects</a>
    </div>
  </div>
</main>

<script>
  (function () {
    var el = document.getElementById('req-path');
    if (el) {
      var p = window.location.pathname;
      el.textContent = p && p !== '/' ? p : 'requested-page';
    }
  })();
</script>
</body>
</html>
