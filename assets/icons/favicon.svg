<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Satish Upadhyaya">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18222e"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <!-- userSpaceOnUse: the underscore is a zero-height bbox, which would
         make an objectBoundingBox gradient degenerate and paint nothing. -->
    <linearGradient id="fg" gradientUnits="userSpaceOnUse"
                    x1="12" y1="14" x2="53" y2="50">
      <stop offset="0" stop-color="#7ff0ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed, fully opaque: no rounded corners, so no transparent
       notches show as white against a light browser tab bar. -->
  <rect width="64" height="64" fill="url(#bg)"/>

  <g fill="none" stroke="url(#fg)" stroke-width="7.5"
     stroke-linecap="round" stroke-linejoin="round">
    <polyline points="16,18 30,32 16,46"/>
    <line x1="36" y1="46" x2="49" y2="46"/>
  </g>
</svg>
